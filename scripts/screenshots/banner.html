<!doctype html>
<!--
  The README banner (1280 × 640), rendered by scripts/screenshots.mts. Colours come from globals.css's light tokens,
  fonts from assets/og (OFL), the picture is a crop of the plan screenshot the same run takes.
-->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <style>
      @font-face { font-family: "Fraunces"; src: url(data:font/woff;base64,{{FRAUNCES}}) format("woff"); }
      @font-face { font-family: "Geist Mono"; src: url(data:font/woff;base64,{{MONO}}) format("woff"); }
      :root { {{TOKENS}} }
      * { box-sizing: border-box; margin: 0; }
      html, body { width: 1280px; height: 640px; overflow: hidden; background: var(--paper); color: var(--ink); }
      .mono { font-family: "Geist Mono", monospace; font-size: 15px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--ink-muted); font-variant-numeric: tabular-nums; }
      .text { position: absolute; left: 72px; top: 0; bottom: 0; width: 500px; display: flex; flex-direction: column; justify-content: center; gap: 22px; }
      h1 { font-family: "Fraunces", serif; font-weight: 400; font-size: 92px; line-height: 1; letter-spacing: -0.02em; }
      .slogan { font-family: "Fraunces", serif; font-size: 38px; line-height: 1.15; color: var(--ink); }
      .route { display: flex; align-items: center; gap: 14px; margin-top: 10px; }
      .code { font-family: "Geist Mono", monospace; font-size: 15px; letter-spacing: 0.08em; padding: 4px 8px; border: 1px solid var(--rule); border-radius: 4px; background: var(--paper-raised); }
      .line { width: 150px; border-top: 2px dashed var(--accent); }
      .shot { position: absolute; left: 620px; top: 70px; width: 820px; border: 1px solid var(--rule); border-radius: 6px; overflow: hidden; background: var(--paper-raised);
              box-shadow: 0 1px 0 var(--rule), 0 24px 48px -24px rgb(0 0 0 / 0.35); }
      .shot img { display: block; width: 100%; }
      .rule { position: absolute; left: 72px; right: 0; bottom: 56px; border-top: 1px solid var(--rule); }
      .foot { position: absolute; left: 72px; bottom: 24px; }
    </style>
  </head>
  <body>
    <div class="text">
      <p class="mono">Open source · free services only</p>
      <h1>Vacationist</h1>
      <p class="slogan">Plan short city breaks</p>
      <div class="route"><span class="code">IST</span><span class="line"></span><span class="code">BCN</span></div>
    </div>
    <div class="shot"><img src="data:image/png;base64,{{SHOT}}" alt="" /></div>
    <div class="rule"></div>
    <p class="mono foot">Places · day-by-day plan · stays · flights · budget</p>
  </body>
</html>
