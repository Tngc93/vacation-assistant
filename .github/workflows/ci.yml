name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Unit tests in several time zones and at pinned times of day (Istanbul
  # 23:59, 00:01 and 03:20), so no test can depend on the machine's zone or clock.
  test:
    name: test (${{ matrix.tz }}${{ matrix.now && format(' @ {0}', matrix.now) || '' }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - tz: UTC
          - tz: Asia/Tokyo
          - tz: America/Los_Angeles
            now: "2026-10-17T23:59:00+03:00"
          - tz: Asia/Tokyo
            now: "2026-10-18T00:01:00+03:00"
          - tz: Europe/Istanbul
            now: "2026-10-17T03:20:00+03:00"
    env:
      TZ: ${{ matrix.tz }}
      VA_TEST_NOW: ${{ matrix.now }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test

  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      # A fake "canary" token: check:bundle fails if its value reaches the browser bundle.
      - run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: 1
          TRAVELPAYOUTS_TOKEN: ci-canary-token-not-real
      # Server-only data and secrets must never reach the browser bundle.
      - run: npm run check:bundle
        env:
          TRAVELPAYOUTS_TOKEN: ci-canary-token-not-real

      # End-to-end checks run against the production build above.
      - name: Read Playwright version
        id: playwright
        run: echo "version=$(npx playwright --version | awk '{print $2}')" >> "$GITHUB_OUTPUT"
      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}
      - name: Install Chromium
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium
      - name: Install Chromium system dependencies
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium
      - run: npm run test:e2e
        env:
          NEXT_TELEMETRY_DISABLED: 1
